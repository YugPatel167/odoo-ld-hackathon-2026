<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Access · GlobeTrotter</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
.auth-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}
.auth-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 440px;
  width: 100%;
  padding: 36px 32px;
}
.auth-tabs {
  display: flex;
  background: var(--parchment);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 24px;
  border: 1px solid var(--line);
}
.auth-tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s var(--ease);
}
.auth-tab-btn.active {
  background: var(--brass);
  color: var(--void);
}
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="home.html" class="nav-logo" style="display: inline-block; margin-bottom: 8px;">Globe<span class="dot">Trotter</span></a>
      <h2 style="font-size: 1.5rem; margin-bottom: 4px;">Welcome Traveler</h2>
      <p class="muted" style="font-size: 0.88rem;">Sign in to access your multi-city itineraries and saved routes.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleAuthSubmit(event, 'login')">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="login-email">Email Address</label>
        <input id="login-email" class="form-control" type="email" placeholder="traveler@globetrotter.com" required value="alex@globetrotter.com">
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="login-password">Password</label>
        <input id="login-password" class="form-control" type="password" placeholder="••••••••" required value="password123">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Log In to GlobeTrotter</button>
      
      <div style="text-align: center; margin-top: 18px; font-size: 0.85rem;" class="muted">
        Don't have an account? <a href="#" onclick="switchAuthTab('signup')" style="color: var(--brass); font-weight: 600;">Sign up now</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" style="display: none;" onsubmit="handleAuthSubmit(event, 'signup')">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="signup-name">Full Name</label>
        <input id="signup-name" class="form-control" type="text" placeholder="Alex Johnson" required>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="signup-email">Email Address</label>
        <input id="signup-email" class="form-control" type="email" placeholder="traveler@globetrotter.com" required>
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="signup-password">Create Password</label>
        <input id="signup-password" class="form-control" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Create Free Account</button>
      
      <div style="text-align: center; margin-top: 18px; font-size: 0.85rem;" class="muted">
        Already registered? <a href="#" onclick="switchAuthTab('login')" style="color: var(--brass); font-weight: 600;">Sign in</a>
      </div>
    </form>

    <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px;">
      <a href="home.html" style="font-size: 0.84rem; color: var(--ink-soft);">← Return to GlobeTrotter Home</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="cursor-ring"></div>
<div id="cursor-dot"></div>

<script src="../js/cursor.js"></script>
<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function switchAuthTab(mode) {
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');

  if (mode === 'login') {
    loginForm.style.display = 'block';
    signupForm.style.display = 'none';
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
  } else {
    loginForm.style.display = 'none';
    signupForm.style.display = 'block';
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
  }
}

function handleAuthSubmit(e, mode) {
  e.preventDefault();
  if (mode === 'login') {
    showToast('✨ Sign in successful! Redirecting to Dashboard...');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);
  } else {
    showToast('🎉 Account created! Welcome to GlobeTrotter.');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('tab') === 'signup') {
    switchAuthTab('signup');
  }
});
</script>
</body>
</html>
